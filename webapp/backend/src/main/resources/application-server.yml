spring:
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goat}
    username: ${DATABASE_USER:goat}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 6
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  jackson:
    default-property-inclusion: always
server:
  forward-headers-strategy: native
  tomcat:
    connection-timeout: 30s
    threads:
      max: 40
      min-spare: 4
    max-connections: 128
    accept-count: 32
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_PATTERN:127\\.0\\.0\\.1|::1}
platform:
  secure-cookies: ${COOKIE_SECURE:true}
  admin-login: ${ADMIN_LOGIN:}
  admin-password: ${ADMIN_PASSWORD:}
  worker-enabled: ${WORKER_ENABLED:false}
  worker-id: ${WORKER_ID:local-worker}
  worker-memory-mib: ${WORKER_MEMORY_MIB:1536}
  worker-cpus: ${WORKER_CPUS:2}
  execution-cpu-budget: ${EXECUTION_CPU_BUDGET:2}
  execution-memory-mib: ${EXECUTION_MEMORY_MIB:1536}
  max-parallel: ${MAX_PARALLEL:1}
  storage-limit-bytes: ${STORAGE_LIMIT_BYTES:10737418240}
  s3-endpoint: ${S3_ENDPOINT:http://localhost:8333}
  s3-public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:8333}
  s3-access-key: ${S3_ACCESS_KEY:}
  s3-secret-key: ${S3_SECRET_KEY:}
  s3-bucket: ${S3_BUCKET:goat}
  runner-mode: ${RUNNER_MODE:docker}
  runner-bambu-image: ${RUNNER_BAMBU_IMAGE:}
  runner-orca-image: ${RUNNER_ORCA_IMAGE:}
  host-work-root: ${HOST_WORK_ROOT:/srv/goat/scratch}
  public-url: ${PUBLIC_URL:http://localhost:3007}
  production: ${PRODUCTION_MODE:false}
  require-challenge: ${REQUIRE_CHALLENGE:false}
  pow-difficulty: ${POW_DIFFICULTY:16}
  max-retries: ${MAX_RETRIES:1}
  max-queue: ${MAX_QUEUE:20}
  job-timeout-seconds: ${JOB_TIMEOUT_SECONDS:1800}
  scratch-limit-bytes: ${SCRATCH_LIMIT_BYTES:2147483648}
  guest-compute-seconds: ${GUEST_COMPUTE_SECONDS:3600}
  account-compute-seconds: ${ACCOUNT_COMPUTE_SECONDS:10800}
  global-compute-seconds: ${GLOBAL_COMPUTE_SECONDS:72000}
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
