spring:
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:19190}

app:
  packer-bin: ${GOAT_PACKER_BIN:../../target/release/colored_3mf_packer}
  scheduler-bin: ${GOAT_SCHEDULER_BIN:../../target/release/daily_scheduler}
  calibration-bin: ${GOAT_CALIBRATION_BIN:../../target/release/ams_calibration}
  profiles-dir: ${GOAT_PROFILES_DIR:../../profiles}
  source-project-bin: ${GOAT_SOURCE_PROJECT_BIN:../../target/release/source_project}
  slicer-presets: ${GOAT_SLICER_PRESETS:}
  bambu-presets: ${GOAT_BAMBU_PRESETS:}
  orca-slicer: ${GOAT_ORCA_SLICER:/Applications/OrcaSlicer.app/Contents/MacOS/OrcaSlicer}
  bambu-slicer: ${GOAT_BAMBU_SLICER:/Applications/BambuStudio.app/Contents/MacOS/BambuStudio}
  jobs-root: ${GOAT_JOBS_ROOT:${java.io.tmpdir}/goat-packer-web/jobs}
  job-ttl-hours: 12
