# Public scheme when TLS is terminated upstream (Pangolin): GOAT_PUBLIC_SCHEME=https (substituted by the
# nginx image entrypoint from /etc/nginx/templates). Empty = this listener's scheme. Configuration, not a
# client header: a client-supplied X-Forwarded-Proto must never change what the backend trusts.
map "${GOAT_PUBLIC_SCHEME}" $goat_proto {
    "" $scheme;
    default "${GOAT_PUBLIC_SCHEME}";
}
map $http_host $goat_authority_port {
    default "";
    ~:(?<goat_port>[0-9]+)$ $goat_port;
}
# Preserve the browser-facing port across Docker's WEB_PORT:80 mapping; an https URL without a port is 443.
# $server_port is only the internal listener (80), not necessarily the public port.
map "$goat_authority_port$goat_proto" $goat_forwarded_port {
    ~^(?<goat_explicit>[0-9]+) $goat_explicit;
    https 443;
    default $server_port;
}

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
limit_req_zone $server_name zone=global_api:1m rate=50r/s;
limit_conn_zone $server_name zone=global_connections:1m;
limit_req_status 429;
limit_conn_status 429;
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;
    client_body_timeout 30s;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        limit_req zone=per_ip burst=20 nodelay;
        limit_req zone=global_api burst=100 nodelay;
        limit_conn global_connections 64;
        limit_conn connections 8;
        proxy_request_buffering off;
        proxy_pass http://api:19190;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $goat_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $goat_forwarded_port;
        # Do not pass client-supplied proxy metadata to the trusted backend.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-By "";
        proxy_read_timeout 180s;
    }
    # Signed S3 links are path-style /<bucket>/<key> on this same origin (S3_PUBLIC_ENDPOINT = public URL of
    # the app): the path and Host reach storage unchanged, so the SigV4 signature (host + path) still matches.
    # Read-only; the bucket name is S3_BUCKET (goat). One public name serves both the app and its files.
    location ^~ /goat/ {
        access_log off; # signed query strings are credentials
        limit_except GET HEAD { deny all; }
        limit_req zone=per_ip burst=10 nodelay;
        proxy_pass http://storage:8333;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri /index.html; }
}
