# Стек goat-packer: Dokploy на main (переменные — в Dokploy) или руками с deploy/.env, см. deploy/README.md.
# Образы приложения собирает deploy/build-images.sh в Docker этой же машины (реестра нет: pull_policy never).
name: goat-packer
x-runtime: &runtime
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
services:
  postgres:
    <<: *runtime
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goat
      POSTGRES_USER: goat
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in Dokploy env or deploy/.env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 384m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, work_mem=2MB]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U goat -d goat']
      interval: 5s
      retries: 20
  storage:
    <<: *runtime
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: goat-storage
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in Dokploy env or deploy/.env}
      S3_BUCKET: goat
    volumes: [object-data:/data]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      retries: 20
  api:
    <<: *runtime
    image: goat-packer-api:${GOAT_VERSION:?set GOAT_VERSION (e.g. v0.1.0)}
    pull_policy: never
    environment: &app-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/goat
      DATABASE_USER: goat
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      S3_ENDPOINT: http://storage:8333
      # Публичный адрес приложения: подписанные ссылки на файлы идут по /goat/ того же имени.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8088}
      S3_ACCESS_KEY: goat-storage
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: goat
      PRODUCTION_MODE: ${PRODUCTION_MODE:-true}
      REQUIRE_CHALLENGE: ${REQUIRE_CHALLENGE:-true}
      # false — без лимитов частоты, активных задач, бюджета и личной квоты (сайт закрыт SSO, чужих нет); общий потолок диска остаётся.
      ADMISSION_LIMITS: ${ADMISSION_LIMITS:-true}
      # Память одной задачи: полная нарезка 49-козьего стола U1 в Orca пикует 5.1 GiB, плюс ~0.5 GiB файлов
      # задачи в её tmpfs (считаются в тот же лимит); при 4 GiB слайсер убивало (exit 137).
      WORKER_MEMORY_MIB: ${WORKER_MEMORY_MIB:-8192}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
      GLOBAL_COMPUTE_SECONDS: ${GLOBAL_COMPUTE_SECONDS:-72000}
      MAX_QUEUE: ${MAX_QUEUE:-20}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong bootstrap password}
      MAX_PARALLEL: ${MAX_PARALLEL:-1}
      STORAGE_LIMIT_BYTES: ${STORAGE_LIMIT_BYTES:-10737418240}
      TRUSTED_PROXY_PATTERN: '172\.(1[6-9]|2[0-9]|3[01])\..*|10\..*|192\.168\..*'
    mem_limit: 768m
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m,uid=1000,gid=1000']
    cap_drop: [ALL]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:19190/api/v2/health || exit 1']
      interval: 10s
      retries: 20
  worker:
    <<: *runtime
    image: goat-packer-worker:${GOAT_VERSION:?set GOAT_VERSION (e.g. v0.1.0)}
    pull_policy: never
    environment:
      <<: *app-env
      ADMIN_LOGIN: ''
      ADMIN_PASSWORD: ''
      WORKER_ID: ${WORKER_ID:-node-1}
      WORKER_ENABLED: 'true'
      EXECUTION_CPU_BUDGET: ${EXECUTION_CPU_BUDGET:-2}
      EXECUTION_MEMORY_MIB: ${EXECUTION_MEMORY_MIB:-8192}
      WORKER_CPUS: ${WORKER_CPUS:-2}
      # WORKER_MEMORY_MIB — из app-env (api проверяет по нему запас под tmpfs задачи).
      # Runner той же версии, что и приложение: в нём бинарники упаковщика этого релиза.
      RUNNER_BAMBU_IMAGE: goat-packer-runner-bambu:${GOAT_VERSION}
      RUNNER_ORCA_IMAGE: goat-packer-runner-orca:${GOAT_VERSION}
      # Путь scratch на ХОСТЕ: worker создаёт sandbox-контейнеры через сокет хоста, и их тома задаются путями
      # хоста. Поэтому HOST_WORK_ROOT и источник монтирования /scratch — одна переменная.
      HOST_WORK_ROOT: ${SCRATCH_ROOT:-/srv/goat/scratch}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${SCRATCH_ROOT:-/srv/goat/scratch}:/scratch
    mem_limit: 512m
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$(find /scratch/$$WORKER_ID -name ready -mmin -1 -print -quit 2>/dev/null)"']
      interval: 10s
      retries: 12
      start_period: 30s
    # Без cap_drop: worker — root с сокетом Docker хоста (то есть и так root на хосте), а файлы задач в /scratch
    # принадлежат uid 1000 sandbox'а. Изоляция — у контейнеров задач (NativeLauncher: network none, cap-drop ALL, …).
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    depends_on: {api: {condition: service_healthy}}
  gateway:
    <<: *runtime
    image: goat-packer-gateway:${GOAT_VERSION:?set GOAT_VERSION (e.g. v0.1.0)}
    pull_policy: never
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:80'
    environment:
      # https за Pangolin/traefik, которые снимают TLS до gateway; пусто — прямой http.
      GOAT_PUBLIC_SCHEME: ${GOAT_PUBLIC_SCHEME:-}
      # Туннель Pangolin приходит с шлюза Docker-сети: X-Forwarded-For от него — адрес клиента; пусто — не доверять.
      GOAT_TRUSTED_UPSTREAM: ${GOAT_TRUSTED_UPSTREAM:-}
    mem_limit: 64m
    # Публичный вход: root только у мастера nginx (порт 80, переход на пользователя nginx), корень read-only.
    # tmpfs — то, что пишет entrypoint образа (conf.d из шаблона, realip.conf) и сам nginx (кэш, pid).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /etc/nginx/goat:size=1m,mode=0755
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      retries: 6
    depends_on: {api: {condition: service_healthy}}
volumes:
  postgres-data:
  object-data:
