[package]
name = "goat_packer"
version = "0.1.0"
edition = "2024"

[dependencies]
geo = "0.33"
quick-xml = "0.42"
rand = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tiny-skia = "0.12"
xmltree = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
