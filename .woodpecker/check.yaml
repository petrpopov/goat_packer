# Проверки goat_packer на main: Rust, backend, frontend, скрипты deploy/.
# Push в ветку после тестов собирает образы goat-packer-*:branch-<ветка> (перезаписываются, не выкладываются).
# Тег тоже проверяется: release.yaml ждёт успешного check и собирает образы версии сам.
# Версии образов шагов — в паре с deploy/Dockerfile.* (шаг lint сверяет их deploy/check-pins.sh).
when:
  - event: [push, pull_request, manual, tag]

labels:
  platform: linux/amd64
  host: main

variables:
  - &rust_image rust:1.94.0-bookworm
  # Кэши Cargo на main переживают сборки. target вне рабочего каталога (CARGO_TARGET_DIR): путь не зависит
  # от того, куда Woodpecker кладёт исходники.
  - &cargo_volumes
    - /var/lib/ci/goat_packer/cargo-registry:/usr/local/cargo/registry
    - /var/lib/ci/goat_packer/target:/cargo-target
  - &cargo_env
    CARGO_BUILD_JOBS: "3"
    CARGO_TARGET_DIR: /cargo-target

# Rust, backend, frontend и lint идут параллельно; образы ветки собираются после всех.
steps:
  - name: rust
    image: *rust_image
    depends_on: []
    volumes: *cargo_volumes
    environment: *cargo_env
    commands:
      - cargo test --release --all --locked

  # Тесты на Testcontainers (тег containers) выключены: `gradle test` их не запускает, им не нужен
  # Docker. Запуск вручную: ./gradlew containersTest.
  - name: backend
    image: eclipse-temurin:21-jdk-jammy
    depends_on: []
    volumes:
      - /var/lib/ci/goat_packer/gradle:/root/.gradle
    commands:
      - cd webapp/backend
      - ./gradlew --no-daemon test || { grep -h -A12 "<failure" build/test-results/test/*.xml | head -80; exit 1; }

  - name: frontend
    image: oven/bun:1.3.14
    depends_on: []
    commands:
      - cd webapp/frontend
      - bun install --frozen-lockfile
      - bun test tests
      - bun run typecheck
      - bun run lint
      - bun run build

  - name: lint
    image: koalaman/shellcheck-alpine:v0.11.0
    depends_on: []
    commands:
      - shellcheck -x deploy/*.sh deploy/runner/slicer.sh
      - sh deploy/check-pins.sh

  - name: images (branch)
    image: docker:29-cli
    depends_on: [rust, backend, frontend, lint]
    when:
      - event: push
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/ci/goat_packer/slicers:/var/lib/ci/goat_packer/slicers
    environment:
      APT_MIRROR: http://mirror.yandex.ru
      SLICER_CACHE: /var/lib/ci/goat_packer/slicers
    commands:
      - apk add -q curl
      - sh deploy/build-images.sh "branch-$(printf '%s' "$CI_COMMIT_BRANCH" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)"
      - sh deploy/prune-images.sh 3

  # Кэш сборки Rust растёт с каждой версией зависимостей: чистим, если больше 10 ГБ (диск main 50 ГБ).
  - name: cleanup target cache
    image: *rust_image
    depends_on: [rust]
    volumes: *cargo_volumes
    environment: *cargo_env
    when:
      - status: [success, failure]
    commands:
      - 'size=$(du -sm "$CARGO_TARGET_DIR" | cut -f1); echo "кэш target: $size МБ"; if [ "$size" -gt 10000 ]; then find "$CARGO_TARGET_DIR" -mindepth 1 -delete; echo "кэш очищен"; fi'
